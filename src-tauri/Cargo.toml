[package]
name = "zerovpn"
version = "0.1.0"
description = "ZeroVPN — Self-hosted WireGuard VPN client"
authors = ["Samuel Banapour"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.1.0" }
tauri-plugin-log = "2"
uuid = { version = "1.10", features = ["v4"] }
dirs = "5.0"
